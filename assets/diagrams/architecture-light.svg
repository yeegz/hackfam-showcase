<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Mona Sans, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d"><title id="t">Hackfam architecture</title><desc id="d">Flutter and Next.js clients call Supabase: Postgres with row-level security and server functions, Realtime, Storage, Auth and Edge Functions; ingestion and services run on cron.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7D8796"/></marker></defs><rect width="1200" height="640" fill="#F5F6F8"/><rect x="40" y="40" width="330" height="150" rx="14" fill="#FFFFFF" stroke="#7D8796" stroke-width="1.25"/><text x="60" y="74" font-size="19" font-weight="700" fill="#111419">Flutter app</text><text x="60" y="102" font-size="15" fill="#545D6B">iPhone, Android, iPad</text><text x="60" y="126" font-size="15" fill="#545D6B">Riverpod, go_router</text><text x="60" y="150" font-size="15" fill="#545D6B">offline outbox, haptics</text><rect x="40" y="230" width="330" height="150" rx="14" fill="#FFFFFF" stroke="#7D8796" stroke-width="1.25"/><text x="60" y="264" font-size="19" font-weight="700" fill="#111419">Next.js web</text><text x="60" y="292" font-size="15" fill="#545D6B">Web app + public event pages</text><text x="60" y="316" font-size="15" fill="#545D6B">@supabase/ssr, OG images, ICS</text><text x="60" y="340" font-size="15" fill="#545D6B">same contract as the app</text><rect x="40" y="420" width="330" height="170" rx="14" fill="#FFFFFF" stroke="#7D8796" stroke-width="1.25"/><text x="60" y="454" font-size="19" font-weight="700" fill="#111419">Shared contract</text><text x="60" y="482" font-size="15" fill="#545D6B">147 client functions</text><text x="60" y="506" font-size="15" fill="#545D6B">errors, copy, DTO schemas</text><text x="60" y="530" font-size="15" fill="#545D6B">generates TypeScript + Dart</text><rect x="460" y="40" width="700" height="550" rx="20" fill="#EDEFF2" stroke="#7D8796" stroke-width="1"/><text x="484" y="76" font-size="20" font-weight="700" fill="#111419">Supabase</text><rect x="484" y="96" width="320" height="236" rx="14" fill="#FFFFFF" stroke="#7D8796" stroke-width="1.25"/><text x="504" y="130" font-size="19" font-weight="700" fill="#111419">Postgres 17</text><text x="504" y="158" font-size="15" fill="#545D6B">Row-level security on every table</text><text x="504" y="182" font-size="15" fill="#545D6B">Writes only through server functions</text><text x="504" y="206" font-size="15" fill="#545D6B">Event + people ranking in SQL</text><text x="504" y="230" font-size="15" fill="#545D6B">PostGIS, pgvector, pg_cron</text><text x="504" y="254" font-size="15" fill="#545D6B">~1,000 pgTAP tests, race tests</text><rect x="824" y="96" width="312" height="110" rx="14" fill="#FFFFFF" stroke="#7D8796" stroke-width="1.25"/><text x="844" y="130" font-size="19" font-weight="700" fill="#111419">Auth</text><text x="844" y="158" font-size="15" fill="#545D6B">Apple, Google, GitHub, LinkedIn,</text><text x="844" y="182" font-size="15" fill="#545D6B">GitLab, Discord, email code</text><rect x="824" y="222" width="312" height="110" rx="14" fill="#FFFFFF" stroke="#7D8796" stroke-width="1.25"/><text x="844" y="256" font-size="19" font-weight="700" fill="#111419">Realtime + Storage</text><text x="844" y="284" font-size="15" fill="#545D6B">ids-only change feed, sync</text><text x="844" y="308" font-size="15" fill="#545D6B">avatars, covers (moderated)</text><rect x="484" y="352" width="652" height="222" rx="14" fill="#FFFFFF" stroke="#7D8796" stroke-width="1.25"/><text x="504" y="386" font-size="19" font-weight="700" fill="#111419">Edge Functions (Deno)</text><text x="504" y="414" font-size="15" fill="#545D6B">ingest: Luma calendars, organiser feeds, pasted links, dedup</text><text x="504" y="438" font-size="15" fill="#545D6B">unfurl + check-link: SSRF-safe fetcher</text><text x="504" y="462" font-size="15" fill="#545D6B">push-dispatch: FCM with quiet hours and caps</text><text x="504" y="486" font-size="15" fill="#545D6B">moderation-screen: AI only with consent; humans decide</text><text x="504" y="510" font-size="15" fill="#545D6B">github-sync, account-purge, purpose screening (designed)</text><line x1="370" y1="115" x2="484" y2="160" stroke="#7D8796" stroke-width="1.5" marker-end="url(#a)"/><text x="435.0" y="131.5" font-size="13" fill="#545D6B">RPC</text><line x1="370" y1="305" x2="484" y2="215" stroke="#7D8796" stroke-width="1.5" marker-end="url(#a)"/><text x="435.0" y="254.0" font-size="13" fill="#545D6B">RPC</text><line x1="370" y1="505" x2="484" y2="460" stroke="#7D8796" stroke-width="1.5" marker-end="url(#a)"/><text x="435.0" y="476.5" font-size="13" fill="#545D6B">types</text></svg>