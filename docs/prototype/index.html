<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackfam · Prototype Tours</title>
<meta name="description" content="Feature tours through the Hackfam design prototype: Onboarding, Events, Discover, and Teams.">
<meta name="color-scheme" content="light dark">
<style>
  @font-face { font-family: "Mona Sans"; src: url("../media/Mona-Sans.ttf") format("truetype"); font-weight: 200 900; font-stretch: 75% 125%; font-display: swap; }
  :root { --bg: #F5F6F8; --surface: #FFFFFF; --ink: #111419; --ink2: #545D6B; --line: #E1E4E9; --control: #7D8796; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B0C0F; --surface: #141519; --ink: #F1F3F6; --ink2: #A3ACB9; --line: #22252B; --control: #6B7586; } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.55 "Mona Sans", -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 48px 24px 80px; }
  
  .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
  .back-link { display: inline-flex; align-items: center; gap: 8px; font-weight: 640; color: var(--ink); text-decoration: none; font-size: 16px; }
  .back-link:hover { text-decoration: underline; }
  
  h1 { font-size: clamp(40px, 7vw, 64px); line-height: 1.05; font-weight: 760; font-stretch: 112%; margin: 0 0 14px; letter-spacing: -0.01em; }
  .lede { font-size: clamp(18px, 2vw, 22px); color: var(--ink2); max-width: 44ch; margin: 0 0 44px; }
  
  .tours { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px 20px; padding: 32px 24px 28px; background: var(--surface); border-radius: 26px; box-shadow: inset 0 0 0 1px var(--line); counter-reset: m; }
  .tour-card { margin: 0; display: flex; flex-direction: column; }
  .phone-frame {
    position: relative;
    border-radius: 36px;
    background: #000;
    padding: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18), inset 0 0 0 1px rgba(255,255,255,0.12);
    overflow: hidden;
    margin: 0 auto;
    width: 100%;
    max-width: 260px;
  }
  .phone-frame img { display: block; width: 100%; height: auto; border-radius: 28px; }
  
  figcaption { margin-top: 18px; font-weight: 640; font-size: 18px; counter-increment: m; }
  figcaption::before { content: counter(m, decimal-leading-zero); display: block; font-stretch: 112%; font-weight: 760; font-size: 15px; color: var(--ink2); margin-bottom: 4px; }
  figcaption span { display: block; color: var(--ink2); font-weight: 400; font-size: 15px; margin-top: 2px; }
  
  footer { margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--ink2); font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px 24px; }
  footer a { color: var(--ink); }
  @media (max-width: 900px) { .tours { grid-template-columns: repeat(2, 1fr); padding: 24px 16px; } }
  @media (max-width: 540px) { .tours { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="nav-bar">
    <a class="back-link" href="../">← Hackfam overview</a>
  </div>

  <h1>Prototype in Motion</h1>
  <p class="lede">Screen recordings captured from the interactive prototype, walking through the core moments of the mobile experience.</p>

  <div class="tours">
    <figure class="tour-card">
      <div class="phone-frame">
        <img src="../media/tour-onboarding-dark.gif" alt="Onboarding flow: pick events, connect GitHub, and choose roles" loading="lazy">
      </div>
      <figcaption>Start with your work<span>Event types, verified work, and role stickers.</span></figcaption>
    </figure>

    <figure class="tour-card">
      <div class="phone-frame">
        <img src="../media/tour-events-dark.gif" alt="Events flow: filter weekend, Seoul Night Build, wristband snaps shut" loading="lazy">
      </div>
      <figcaption>Find your weekend<span>Filter events, then the wristband snaps.</span></figcaption>
    </figure>

    <figure class="tour-card">
      <div class="phone-frame">
        <img src="../media/tour-discover-dark.gif" alt="Discover flow: drag and swipe builders, mutual match with Inês" loading="lazy">
      </div>
      <figcaption>Meet the pool<span>Swipe by hand, both say yes.</span></figcaption>
    </figure>

    <figure class="tour-card">
      <div class="phone-frame">
        <img src="../media/tour-team-dark.gif" alt="Teams flow: accept request, team full, checklist, final hour countdown" loading="lazy">
      </div>
      <figcaption>Fill the team<span>Last seat accepted, checklist, final hour.</span></figcaption>
    </figure>
  </div>

  <footer>
    <span>Design prototype. In active development, not yet released.</span>
    <span>Built by <a href="https://github.com/yeegz">Yousof Selim</a> · <a href="https://yousofselim.com">yousofselim.com</a></span>
  </footer>
</main>
</body>
</html>
